name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          ROLLDOWN_VERSION=$(node -p "require('./node_modules/rolldown/package.json').version")
          npm install --no-save @rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION
      - name: Validate the knowledge graph (cycles, dangling prerequisites, hour sums)
        run: npm run validate-graph
      - name: Tests (in-memory MongoDB, no secrets needed)
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build